<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Conf 2026 | Ticket</title>
  <link rel="icon" href="assets/images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <a href="index.html">
      <img src="assets/images/logo-full.svg" alt="Coding Conf" width="190" height="30">
    </a>

    <nav aria-label="Main">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#details">Details</a></li>
        <li><a href="index.html#expect">What to expect</a></li>
        <li><a href="login.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" hidden>
    <section class="hero">
      <h1>Congrats, <span class="gradient-text" id="out-name-heading"></span>! Your ticket is ready.</h1>
      <p class="lead">Your ticket details have been sent to <span class="accent" id="out-email"></span>.</p>
    </section>

    <section aria-label="Your conference ticket">
      <article class="ticket">
        <div class="ticket__main">
          <img src="assets/images/logo-full.svg" alt="Coding Conf" width="190" height="30">
          <p class="ticket__meta">October 26, 2026 / Papine, Kgn</p>

          <div class="ticket__person">
            <img class="ticket__avatar" id="out-avatar" src="assets/images/image-avatar.jpg" alt="Profile photo" width="72" height="72">
            <p class="ticket__name" id="out-name"></p>
            <a class="ticket__github" id="out-github" href="https://github.com/">
              <img src="assets/images/icon-github.svg" alt="" width="20" height="20">
              <span id="out-github-text"></span>
            </a>
          </div>
        </div>

        <p class="ticket__serial" id="out-serial" aria-label="Ticket number"></p>
      </article>
    </section>

    <p class="back"><a href="login.html">Register another attendee</a></p>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Coding Conf. CIT2011 Web Programming, IA#2,Bakari Walker.</p>
  </footer>

  <script src="js/ticket.js"></script>
</body>
</html>
